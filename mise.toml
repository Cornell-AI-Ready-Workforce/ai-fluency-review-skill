min_version = "2026.7.16"

[tools]
python = "3.14.6"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]

[tasks.validate]
description = "Validate the skill and render the public example"
run = [
  "python -m json.tool examples/minimal-assessment.json >/dev/null",
  "python skills/ai-fluency-review/scripts/render_report.py --input examples/minimal-assessment.json --output ai_fluency_review.html",
  "python tests/validate_package.py"
]
